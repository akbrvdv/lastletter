[versions]
# ─── Build Tools ───────────────────────────────────────────────────────────────
agp                     = "8.7.3"
firebaseBomVersion = "32.7.0"
kotlin                  = "2.1.0"
ksp                     = "2.1.0-1.0.29"

# ─── AndroidX Core ─────────────────────────────────────────────────────────────
coreKtx                 = "1.16.0"
appcompat               = "1.7.1"
lifecycleRuntime        = "2.9.0"
activityCompose         = "1.10.1"

# ─── Jetpack Compose ───────────────────────────────────────────────────────────
composeBom              = "2025.05.00"
navigationCompose       = "2.9.0"

# ─── Room (Local DB + FTS5) ────────────────────────────────────────────────────
room                    = "2.7.1"

# ─── Firebase ──────────────────────────────────────────────────────────────────
googleServices          = "4.4.2"
firebaseBom             = "33.14.0"

# ─── Hilt (Dependency Injection) ───────────────────────────────────────────────
hilt                    = "2.56.1"
hiltNavigationCompose   = "1.2.0"

# ─── Kotlin Coroutines ─────────────────────────────────────────────────────────
coroutines              = "1.10.2"

# ─── Testing ───────────────────────────────────────────────────────────────────
junit                   = "4.13.2"
junitVersion            = "1.2.1"
espressoCore            = "3.6.1"


[libraries]
# ─── AndroidX Core ─────────────────────────────────────────────────────────────
androidx-core-ktx               = { group = "androidx.core",               name = "core-ktx",                      version.ref = "coreKtx" }
androidx-appcompat              = { group = "androidx.appcompat",          name = "appcompat",                     version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx  = { group = "androidx.lifecycle",         name = "lifecycle-runtime-ktx",         version.ref = "lifecycleRuntime" }
androidx-lifecycle-viewmodel    = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-ktx",        version.ref = "lifecycleRuntime" }
androidx-activity-compose       = { group = "androidx.activity",          name = "activity-compose",              version.ref = "activityCompose" }

# ─── Jetpack Compose (via BOM — versi diatur otomatis) ─────────────────────────
compose-bom                     = { group = "androidx.compose",            name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                      = { group = "androidx.compose.ui",         name = "ui" }
compose-ui-graphics             = { group = "androidx.compose.ui",         name = "ui-graphics" }
compose-ui-tooling-preview      = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
compose-material3               = { group = "androidx.compose.material3",  name = "material3" }
compose-ui-tooling              = { group = "androidx.compose.ui",         name = "ui-tooling" }
compose-ui-test-manifest        = { group = "androidx.compose.ui",         name = "ui-test-manifest" }
compose-ui-test-junit4          = { group = "androidx.compose.ui",         name = "ui-test-junit4" }
compose-animation               = { group = "androidx.compose.animation",  name = "animation" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-bom-v3270 = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBomVersion" }
navigation-compose              = { group = "androidx.navigation",         name = "navigation-compose",            version.ref = "navigationCompose" }

# ─── Room (FTS5) ───────────────────────────────────────────────────────────────
room-runtime                    = { group = "androidx.room",               name = "room-runtime",                  version.ref = "room" }
room-ktx                        = { group = "androidx.room",               name = "room-ktx",                      version.ref = "room" }
room-compiler                   = { group = "androidx.room",               name = "room-compiler",                 version.ref = "room" }

# ─── Firebase (via BOM) ────────────────────────────────────────────────────────
firebase-bom                    = { group = "com.google.firebase",         name = "firebase-bom",                  version.ref = "firebaseBom" }
firebase-auth-ktx               = { group = "com.google.firebase",         name = "firebase-auth-ktx" }
firebase-database-ktx           = { group = "com.google.firebase",         name = "firebase-database-ktx" }

# ─── Hilt ──────────────────────────────────────────────────────────────────────
hilt-android                    = { group = "com.google.dagger",           name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                   = { group = "com.google.dagger",           name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose         = { group = "androidx.hilt",               name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }

# ─── Kotlin Coroutines ─────────────────────────────────────────────────────────
kotlinx-coroutines-android      = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",    version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# ─── Testing ───────────────────────────────────────────────────────────────────
junit                           = { group = "junit",                       name = "junit",                         version.ref = "junit" }
androidx-junit                  = { group = "androidx.test.ext",           name = "junit",                         version.ref = "junitVersion" }
androidx-espresso-core          = { group = "androidx.test.espresso",      name = "espresso-core",                 version.ref = "espressoCore" }


[plugins]
android-application             = { id = "com.android.application",        version.ref = "agp" }
kotlin-android                  = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-compose                  = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                             = { id = "com.google.devtools.ksp",        version.ref = "ksp" }
hilt-android                    = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services                 = { id = "com.google.gms.google-services", version.ref = "googleServices" }
